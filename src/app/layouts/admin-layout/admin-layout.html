<div class="admin-layout">
  
  <!-- TOPBAR (Estilo Wispro: ancho total, superpuesta al sidebar) -->
  <header class="admin-topbar">
    <div class="topbar-left">
      <!-- Botón Hamburguesa -->
      <button class="btn-icon menu-toggle" (click)="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>

      <!-- Logo e Institución -->
      <div class="topbar-brand">
        <div class="brand-logo-container">
          <img src="/favicon.svg" alt="Logo Institución" class="brand-logo">
        </div>
        <div class="brand-text">
          <span class="institution-name">E.E.T. N°3139 "Martín Miguel de Güemes"</span>
        </div>
      </div>
    </div>

    <div class="topbar-right">
      <!-- Notificaciones -->
      <button class="btn-icon notification-bell">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
        <div class="notification-dot"></div>
      </button>
      
      <!-- Menú de Usuario (Secretaría / Directivo) -->
      <div class="user-menu-container">
        <button class="btn-icon user-avatar" (click)="toggleProfileMenu()">
          @if (adminUser.role === 'DIRECTIVO') {
            <!-- Ícono Directivo (Escudo de seguridad y persona) -->
            <svg viewBox="0 0 24 24" fill="currentColor" class="role-icon-header"><path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm4 8H8v-.57c0-1.42 2.54-2.43 4-2.43s4 1.01 4 2.43V14z"/></svg>
          } @else {
            <!-- Ícono Secretario (Credencial corporativa) -->
            <svg viewBox="0 0 24 24" fill="currentColor" class="role-icon-header"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm0 4c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1.4c0-2 4-3.1 6-3.1s6 1.1 6 3.1V19z"/></svg>
          }
        </button>

        <!-- Menú Desplegable con Info -->
        <div class="profile-dropdown" [class.show]="isProfileMenuOpen">
          <div class="profile-header-info">
            <div class="profile-name">{{ adminUser.name }}</div>
            <div class="profile-email">{{ adminUser.email }}</div>
            <div class="profile-phone">{{ adminUser.phone }}</div>
            <div class="profile-role-badge">
              <span class="badge" [class.badge-directivo]="adminUser.role === 'DIRECTIVO'">{{ adminUser.role }}</span>
            </div>
          </div>
          <div class="profile-actions">
            <button class="btn-logout" (click)="logout()">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
              Cerrar sesión
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENIDO INFERIOR -->
  <div class="admin-body">
    
    <!-- Backdrop para móviles -->
    <div class="sidebar-backdrop" [class.show]="isSidebarOpen && isMobile" (click)="closeSidebarOnMobile()"></div>

    <!-- SIDEBAR -->
    <aside class="admin-sidebar" [class.open]="isSidebarOpen">
      <nav class="sidebar-nav">
        <!-- Contratos -->
        <a routerLink="contratos" routerLinkActive="active" class="nav-item" data-tooltip="Contratos" (click)="closeSidebarOnMobile()">
          <svg viewBox="0 0 24 24" fill="currentColor" class="nav-icon"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
          <span class="nav-text">Contratos</span>
        </a>
        <!-- Estudiantes -->
        <a routerLink="estudiantes" routerLinkActive="active" class="nav-item" data-tooltip="Estudiantes" (click)="closeSidebarOnMobile()">
          <svg viewBox="0 0 24 24" fill="currentColor" class="nav-icon"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
          <span class="nav-text">Estudiantes</span>
        </a>
        <!-- Tutores -->
        <a routerLink="tutores" routerLinkActive="active" class="nav-item" data-tooltip="Tutores" (click)="closeSidebarOnMobile()">
          <svg viewBox="0 0 24 24" fill="currentColor" class="nav-icon"><path d="M16.5 12c1.38 0 2.49-1.12 2.49-2.5S17.88 7 16.5 7C15.12 7 14 8.12 14 9.5s1.12 2.5 2.5 2.5zM9 11c1.66 0 2.99-1.34 2.99-3S10.66 5 9 5C7.34 5 6 6.34 6 8s1.34 3 3 3zm7.5 3c-1.83 0-5.5.92-5.5 2.75V19h11v-2.25c0-1.83-3.67-2.75-5.5-2.75zM9 13c-2.33 0-7 1.17-7 3.5V19h7v-2.25c0-.85.33-2.34 2.37-3.47C10.5 13.1 9.66 13 9 13z"/></svg>
          <span class="nav-text">Tutores</span>
        </a>
        <!-- Docentes -->
        <a routerLink="docentes" routerLinkActive="active" class="nav-item" data-tooltip="Docentes" (click)="closeSidebarOnMobile()">
          <svg viewBox="0 0 24 24" fill="currentColor" class="nav-icon"><path d="M12 11.55C9.64 9.35 6.48 8 3 8v11c3.48 0 6.64 1.35 9 3.55 2.36-2.19 5.52-3.55 9-3.55V8c-3.48 0-6.64 1.35-9 3.55zM12 8c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3z"/></svg>
          <span class="nav-text">Docentes</span>
        </a>
        <!-- Personal -->
        <a routerLink="personal" routerLinkActive="active" class="nav-item" data-tooltip="Personal" (click)="closeSidebarOnMobile()">
          <svg viewBox="0 0 24 24" fill="currentColor" class="nav-icon"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm0 4c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1.4c0-2 4-3.1 6-3.1s6 1.1 6 3.1V19z"/></svg>
          <span class="nav-text">Personal</span>
        </a>

        <div class="sidebar-divider"></div>

        <!-- Alertas -->
        <a routerLink="alertas" routerLinkActive="active" class="nav-item" data-tooltip="Alertas" (click)="closeSidebarOnMobile()">
          <svg viewBox="0 0 24 24" fill="currentColor" class="nav-icon"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
          <span class="nav-text">Alertas</span>
        </a>
        <!-- Noticias -->
        <a routerLink="noticias" routerLinkActive="active" class="nav-item" data-tooltip="Noticias" (click)="closeSidebarOnMobile()">
          <svg viewBox="0 0 24 24" fill="currentColor" class="nav-icon"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 14H4v-4h11v4zm0-5H4V9h11v4zm5 5h-4V9h4v9z"/></svg>
          <span class="nav-text">Noticias</span>
        </a>
        <!-- Facturación -->
        <a routerLink="facturacion" routerLinkActive="active" class="nav-item" data-tooltip="Facturación" (click)="closeSidebarOnMobile()">
          <svg viewBox="0 0 24 24" fill="currentColor" class="nav-icon"><path d="M19 14V6c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zm-9-1c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-6v11c0 1.1-.9 2-2 2H4v-2h17V7h2z"/></svg>
          <span class="nav-text">Facturación</span>
        </a>
        <!-- Cursos -->
        <a routerLink="cursos" routerLinkActive="active" class="nav-item" data-tooltip="Cursos" (click)="closeSidebarOnMobile()">
          <svg viewBox="0 0 24 24" fill="currentColor" class="nav-icon"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          <span class="nav-text">Cursos</span>
        </a>
        <!-- Chats -->
        <a routerLink="chats" routerLinkActive="active" class="nav-item" data-tooltip="Chats" (click)="closeSidebarOnMobile()">
          <svg viewBox="0 0 24 24" fill="currentColor" class="nav-icon"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 9h-2V9h2v2zm4 0h-2V9h2v2zm-8 0H7V9h2v2z"/></svg>
          <span class="nav-text">Chats</span>
        </a>
      </nav>
    </aside>

    <!-- ÁREA DE CONTENIDO -->
    <main class="admin-content-wrapper">
      <router-outlet></router-outlet>
    </main>
    
  </div>
</div>
