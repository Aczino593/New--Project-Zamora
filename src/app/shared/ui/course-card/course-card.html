<div class="course-card" [routerLink]="[routePrefix, course.id]">
  <!-- Encabezado estilo Google Classroom -->
  <div class="card-header">
    <div class="course-title-group">
      <h3 class="course-name" [title]="course.nombre">{{ course.nombre }}</h3>
      <span class="course-subtitle">{{ courseSubtitle }}</span>
    </div>
    <button class="btn-options" (click)="$event.stopPropagation()" title="Opciones">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 12.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 18.75a.75.75 0 110-1.5.75.75 0 010 1.5z" />
      </svg>
    </button>
  </div>

  <!-- Pie de tarjeta con Docente y Especialidad -->
  <div class="card-footer">
    <div class="prof-group" *ngIf="course.professor">
      <div class="prof-avatar-dot">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
        </svg>
      </div>
      <span class="course-prof">{{ course.professor }}</span>
    </div>
    <span class="course-badge" *ngIf="course.specialty && course.specialty !== '-'">{{ course.specialty }}</span>
  </div>
</div>
